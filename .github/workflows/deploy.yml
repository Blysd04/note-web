name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ---------- 1. Build backend Go ----------
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: be/go.sum

      - name: Test backend
        working-directory: be
        run: go test ./...

      - name: Build binary Linux
        working-directory: be
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o note-backend .

      # ---------- 2. Build frontend React ----------
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ---------- 3. Copy sản phẩm build lên VPS ----------
      - name: Copy binary + dist lên VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "be/note-backend,frontend/dist"
          target: /tmp/noteapp-deploy

      # ---------- 4. Kích hoạt bản mới trên VPS ----------
      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mv /tmp/noteapp-deploy/be/note-backend /root/var/www/note-web/be/note-backend.new
            chmod +x /root/var/www/note-web/be/note-backend.new
            mv -f /root/var/www/note-web/be/note-backend.new /root/var/www/note-web/be/note-backend

            rm -rf /root/var/www/note-web/frontend/dist
            mv /tmp/noteapp-deploy/frontend/dist /root/var/www/note-web/frontend/dist
            rm -rf /tmp/noteapp-deploy

            pm2 restart note-backend --update-env

            sleep 2
            curl -fs http://127.0.0.1:5000/api/health

      # ---------- 5. Thông báo Telegram ----------
      - name: Telegram — deploy thành công
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode=Markdown \
            --data-urlencode text="✅ *note-app deploy THÀNH CÔNG*
          👤 ${{ github.actor }}
          📝 ${{ github.event.head_commit.message }}
          🔗 https://note-web.yetsir.click/"

      - name: Telegram — deploy thất bại
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="❌ note-app deploy THẤT BẠI!
          👤 ${{ github.actor }}
          📝 ${{ github.event.head_commit.message }}
          🔍 Xem log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"